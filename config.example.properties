# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…); LG and Samsung: en, es, pt, de, ru
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (on Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay.
# For apps the TV ships that you don't subscribe to (Prime Video on a Sony, say).
hide_services=

# Your shows, first on the home screen (Explore, with a TMDB key): OK resumes each one in Netflix where you stopped.
# Comma separated, each one TMDB's number:Netflix's number, from their web addresses
# (themoviedb.org/tv/2316-the-office and netflix.com/title/70136120 → 2316:70136120).
my_shows=

# Optional: a free Watchmode key (watchmode.com) makes the picks open the title's own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=
# Optional: security cameras on an HDMI input (a DVR or NVR recorder): its number, e.g. 1. When the TV is idle, the
# screensaver switches to it (while the recorder sends a picture), and a Cameras card on the shelf opens it.
camera_hdmi=
# true: the TV turns on (from standby, or after a restart) straight to camera_hdmi.
start_on_cameras=false
# Optional: a picture behind the home screen when there are no picks (no TMDB key), e.g. ~/Pictures/wallpaper.jpg.
# A tall one stands at the right over a blur of itself; a wide one fills the screen. The home screen turns dark.
wallpaper=
# OnePlus remotes: what each button opens until it's changed on the TV (Free My TV > Remote Buttons), comma separated.
# Buttons: netflix, youtube, prime, menu, mic. Values: an app's package, "cameras" (camera_hdmi) or "voice" (YouTube
# voice search; needs disable_assistant=false). Left out: the button works as always. E.g. menu=cameras,mic=voice
remote_buttons=
# Optional: restart the TV once a week, at night (day and hour, e.g. "sun 4": Sundays around 4 AM). Helps TVs with
# little memory that slow down over days. Empty: never.
weekly_restart=
# Optional: minutes after the TV is switched off before it switches itself back on (a TV that should always show the
# cameras; with start_on_cameras it opens them). 0: stays off.
auto_wake_minutes=0
# true leaves Live TV (the antenna's channels) off the home screen and the inputs list.
hide_live_tv=false
